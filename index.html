<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aba. — painel do time de design</title>
<meta name="description" content="Pontos, cards, tempo online e escala do time de design.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M10 62 Q50 10 90 62 Z' fill='%2318181B'/><rect x='4' y='60' width='70' height='12' rx='6' fill='%2318181B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div class="app">
  <aside class="rail" aria-label="Seções">
    <div class="rail-logo" title="aba. — painel do time de design"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M2.5 15.5h13.5a4 4 0 0 0 4-4"/><path d="M12 7V5.5"/></svg></div>
    <nav class="rail-nav" id="nav"></nav>
    <div class="rail-foot"><span class="demo-dot" title="modo demonstração: dados salvos só neste navegador"></span></div>
  </aside>
  <div class="shell">
    <header class="top">
      <h1 class="top-title" id="title"></h1>
      <div class="me" id="me"></div>
    </header>
    <main id="main"></main>
  </div>
</div>

<!-- Card manual -->
<dialog id="cardDlg">
  <form id="cardForm" novalidate>
    <header><span class="eyebrow mono">novo card</span><button type="button" class="x" data-close aria-label="Fechar">×</button></header>
    <input name="client" class="title-in" placeholder="Nome do cliente / empresa" autocomplete="off">
    <div class="field-row">
      <label>Modelo do boné<input name="model" list="models" autocomplete="off"></label>
      <label>Vendedor<input name="seller" autocomplete="off"></label>
    </div>
    <div class="field-row">
      <label>Designer<select name="designerId"></select></label>
      <label>Nº no lulu (opcional)<input name="luluId" autocomplete="off" inputmode="numeric"></label>
    </div>
    <datalist id="models"><option>Trucker</option><option>Americano</option><option>Dad hat</option><option>Bucket</option><option>Aba reta</option><option>Boné Sport</option><option>Viseira Sport</option><option>New York</option></datalist>
    <p class="err" id="cardErr" role="alert"></p>
    <footer><span class="sp"></span><button type="button" class="ghost" data-close>Cancelar</button><button type="submit" class="solid">Criar card</button></footer>
  </form>
</dialog>

<!-- Pessoa -->
<dialog id="personDlg">
  <form id="personForm" novalidate>
    <header><span class="eyebrow mono" id="pEyebrow">nova pessoa</span><button type="button" class="x" data-close aria-label="Fechar">×</button></header>
    <input name="name" class="title-in" placeholder="Nome" autocomplete="off">
    <div class="reg-pick">
      <label><input type="radio" name="regime" value="CLT" checked><span><b>CLT</b><small class="mono">08–18 · almoço 12–13</small></span></label>
      <label><input type="radio" name="regime" value="PJ"><span><b>PJ</b><small class="mono">08–18 direto + escala</small></span></label>
      <label><input type="radio" name="regime" value="ADM"><span><b>Admin</b><small class="mono">gestão · não pontua</small></span></label>
    </div>
    <label>E-mail (usado na integração com o lulu)<input name="email" type="email" autocomplete="off"></label>
    <div class="swatches" id="swatches"></div>
    <label class="switch"><input type="checkbox" name="payByPoints" checked><i></i>recebe por pontos</label>
    <p class="err" id="personErr" role="alert"></p>
    <footer><span class="sp"></span><button type="button" class="ghost" data-close>Cancelar</button><button type="submit" class="solid">Salvar</button></footer>
  </form>
</dialog>

<!-- Escala de uma hora -->
<dialog id="shiftDlg">
  <form id="shiftForm" novalidate>
    <header><span class="eyebrow mono">escala noturna</span><button type="button" class="x" data-close aria-label="Fechar">×</button></header>
    <h2 class="dlg-title" id="shiftTitle"></h2>
    <p class="muted dlg-sub">Quem disse que fica online nesse horário.</p>
    <div class="who-pick" id="shiftPeople"></div>
    <label class="switch"><input type="checkbox" name="allNight"><i></i>aplicar na noite toda</label>
    <footer><button type="button" class="ghost danger" id="shiftClear">Esvaziar</button><span class="sp"></span><button type="button" class="ghost" data-close>Cancelar</button><button type="submit" class="solid">Salvar</button></footer>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

<script src="js/store.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
